<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#667085;--bd:#e4e8ef;--nv:#14284b;--bl:#2f6fed;--gr:#12a150;--am:#c27c00;--rd:#d92d20;--bg-g:#e7f6ee;--bg-a:#fdf3dc;--bg-r:#fde8e6;--bg-b:#e8effd;--in:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1524;--card:#17203a;--tx:#e8edf7;--mu:#97a3bb;--bd:#2a3556;--nv:#0a1124;--bl:#6c9bff;--gr:#3ccf84;--am:#f0b429;--rd:#ff7a70;--bg-g:#12352a;--bg-a:#3a2f12;--bg-r:#40201e;--bg-b:#1b2a52;--in:#101830}}
:root[data-theme=dark]{--bg:#0e1524;--card:#17203a;--tx:#e8edf7;--mu:#97a3bb;--bd:#2a3556;--nv:#0a1124;--bl:#6c9bff;--gr:#3ccf84;--am:#f0b429;--rd:#ff7a70;--bg-g:#12352a;--bg-a:#3a2f12;--bg-r:#40201e;--bg-b:#1b2a52;--in:#101830}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Fira Sans",Ubuntu,Oxygen,"Oxygen Sans",Cantarell,"Droid Sans","Apple Color Emoji","Segoe UI Emoji","Lucida Grande",Helvetica,Arial,sans-serif}
.app{display:flex;min-height:100%}.side{width:220px;background:var(--nv);color:#fff;padding:18px 12px;flex:none;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:18px;padding:4px 10px 18px}.logo span{color:#7fb0ff}
.side a{display:block;color:#c5d3ee;padding:9px 12px;border-radius:9px;text-decoration:none;margin-bottom:3px;cursor:pointer}.side a.on,.side a:hover{background:rgba(255,255,255,.12);color:#fff}
.side small{display:block;color:#8fa3c9;padding:14px 10px 0;font-size:11px}
main{flex:1;padding:24px;max-width:1200px;min-width:0}h1{font-size:22px;margin:0 0 4px;color:var(--tx)}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}.sub{color:var(--mu);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:16px}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:12px;font-weight:600}
.tw{overflow-x:auto}.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.g{background:var(--bg-g);color:var(--gr)}.a{background:var(--bg-a);color:var(--am)}.r{background:var(--bg-r);color:var(--rd)}.b{background:var(--bg-b);color:var(--bl)}
button,.btn{background:var(--bl);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:var(--bg-b);color:var(--bl)}button.d{background:var(--rd)}button.ok{background:var(--gr)}button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 3px}input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);font:inherit}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.steps div{padding:6px 12px;border-radius:99px;background:var(--bg-b);color:var(--bl);font-size:12px;font-weight:600}.steps .on{background:var(--bl);color:#fff}
.stage{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--bg-b);color:var(--mu)}
.sp{border:3px solid var(--bg-b);border-top-color:var(--bl);animation:r 1s linear infinite;background:none}@keyframes r{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--bg-b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);transition:width .4s}
.note{background:var(--bg-b);color:var(--tx);border-left:4px solid var(--bl);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.demo{background:var(--bg-a);color:var(--am);padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.hb i{display:block;height:14px;background:var(--bl);border-radius:4px;min-width:3px}.hb span:first-child{width:150px;color:var(--mu);flex:none}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:9px;font:13px/1.5 inherit;border:1px solid var(--bd)}.mu{color:var(--mu)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp1{flex:1}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.side small,.logo{display:none}main{padding:14px}}

function submitNew(){collect();const miss=["legal","type","email","pan","acct","ifsc"].filter(k=>!F[k]);if(miss.length){$("#err").textContent="Please complete required fields: "+miss.join(", ")+" (go back to the earlier steps).";return}const docs={};DK.forEach(k=>{if(NF[k]){docs[k]={file:NF[k].name,size:NF[k].size}}});
const v=mkVendor({...F,type:F.type||"Private Limited"},docs);DK.forEach(k=>{if(NF[k])FILES[v.id+k]=NF[k]});F={};NF={};NS=0;startRun(v)}
function mkVendor(form,docs,o={}){const id="VV-"+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,4).toUpperCase();const v={id,created:Date.now(),form,docs,runs:[],audit:[],comments:[],status:"PROCESSING",...o};S.vendors.push(v);log(v,"Documents uploaded",Object.keys(docs).map(k=>DN[k]+" ("+docs[k].file+")").join(", ")||"none");save();return v}
const vList=(t,l)=>`<h1>${t}</h1><div class="sub">${l.length} record(s)</div><div class="card">${vtable(l.slice().reverse())}</div>`;
function vHistory(){const rs=S.vendors.flatMap(v=>v.runs.map(r=>({v,r}))).sort((a,b)=>b.r.start-a.r.start);return `<h1>Verification History</h1><div class="sub">Every verification run, including re-runs after resubmission.</div><div class="card tw"><table><tr><th>Vendor</th><th>Run</th><th>Started</th><th>Duration</th><th>Outcome</th><th></th></tr>${rs.map(({v,r})=>`<tr><td>${esc(v.form.legal)}${DB(v)}</td><td>${v.id} · #${r.n}</td><td>${dt(r.start)}</td><td>${r.end?((r.end-r.start)/1000).toFixed(1)+" s":"–"}</td><td>${B(r.decision||"PROCESSING")}</td><td><a class="btn s" href="#v-${v.id}">Details</a></td></tr>`).join("")||'<tr><td colspan=6 class="mu">No runs yet.</td></tr>'}</table></div>`}
function vDemo(){return `<h1>Demo Scenarios</h1><div class="sub">Four executable edge cases. <span class="demo">DEMO DATA</span> – synthetic vendors and a simulated verification registry; nothing here is a real government or bank verification.</div><div class="grid g2">${SC.map((c,i)=>`<div class="card"><span class="demo">DEMO DATA</span><h2 style="margin-top:8px">Scenario ${i+1}: ${c.t}</h2><p>${c.d}</p><p class="mu">Vendor: ${c.n} · Expected: <b>${c.exp}</b></p><button onclick="runScn('${c.k}')">Run scenario</button></div>`).join("")}</div>`}
function runScn(k){const c=SC.find(x=>x.k==k),{form,docs}=scnVendor(c);startRun(mkVendor(form,docs,{demo:1,scn:k}))}
function vRun(id){const l=LIVE&&LIVE.v.id==id?LIVE:null,v=S.vendors.find(x=>x.id==id);if(!v)return"<h1>Not found</h1>";const run=l?l.run:v.runs[v.runs.length-1];if(!run)return"<h1>No run</h1>";const done=run.stages.filter(s=>!["queued","running"].includes(s.status)).length,IC={queued:"○",running:"",PASS:"✓",FAIL:"✕"};
let h=`<h1>Live Verification Run – ${esc(v.form.legal)}${DB(v)}</h1><div class="sub">${v.id} · run #${run.n} · started ${tm(run.start)}</div><div class="card"><div class="row"><b>${done}/${run.stages.length} stages</b><span class="sp1"></span>${B(run.end?v.status:"PROCESSING")}</div><div class="bar" style="margin:8px 0 6px"><i style="width:${done/run.stages.length*100}%"></i></div>`;
h+=run.stages.map(s=>{const c=bc(s.status);return `<div class="stage"><div class="ic ${s.status=="running"?"sp":c}">${s.status=="running"?"":IC[s.status]||"!"}</div><div class="sp1"><b>${s.name}</b> ${s.status!="queued"&&s.status!="running"?B(s.status):""}<div class="mu">${s.status=="running"?"Running… "+esc(LIVE?.prog||""):esc(s.res||"Waiting")} ${s.start?" · "+tm(s.start)+(s.end?" → "+tm(s.end):""):""}</div>${s.warn.map(w=>`<div style="color:var(--${s.status=="FAIL"?"rd":"am"});font-size:12px">⚠ ${esc(w)}</div>`).join("")}</div></div>`}).join("")+"</div>";
if(l&&l.gate){h+=`<div class="card"><h2>Review extracted data</h2><div class="note">Correct any OCR errors before verification continues. Empty or low-confidence fields were not guessed.</div>${editExt(v)}<button class="ok" onclick="confirmGate()">Confirm &amp; continue verification</button></div>`}
if(run.end)h+=`<div class="card"><h2>Decision: ${B(v.status)}</h2><ul>${v.decision.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><p class="mu">${esc(v.decision.rule)}</p><a class="btn" href="#v-${v.id}">Open vendor details &amp; notification</a></div>`;return h}
function editExt(v){return Object.entries(v.docs).map(([k,d])=>`<h3>${DN[k]} <span class="mu">${esc(d.file)}${d.pages?" · "+d.pages+" page(s)":""}${d.engine?" · "+esc(d.engine):""}</span> <button class="s" onclick="viewDoc('${v.id}','${k}')">View</button> ${d.path||FILES[v.id+k]?`<button class="s" onclick="reext('${v.id}','${k}',this)">Re-extract</button>`:""}</h3>${d.matches===false?'<div style="color:var(--am)">⚠ This file does not look like a '+DN[k]+'.</div>':""}${d.err?`<div style="color:var(--rd)">Extraction failed: ${esc(d.err)}</div>`:""}<table>${FIELDS[k].map(([f,l])=>{const e=d.ext?.[f]||{v:"",c:0};return `<tr><td style="width:170px">${l}${e.p?` <span class="mu">p.${e.p}</span>`:""}${e.manual?" ✎":""}</td><td><input data-x="${k}.${f}" value="${esc(e.v)}"></td><td style="width:90px">${B(e.c>=.8?"PASS":e.c>=.4?"LOW":"NONE").replace("PASS",Math.round(e.c*100)+"%").replace("LOW",Math.round(e.c*100)+"%")}</td></tr>`}).join("")}</table>${d.proc?`<details><summary class="mu">Processing details &amp; raw text (${d.proc.pageInfo.map(p=>"p"+p.n+": "+(p.method=="text"?"text layer":"OCR "+p.conf+"%")).join(", ")})</summary><pre>${esc(d.proc.text)}</pre></details>`:""}`).join("")}
function readExt(v){document.querySelectorAll("[data-x]").forEach(i=>{const[k,f]=i.dataset.x.split("."),e=v.docs[k].ext[f];if(e.v!=i.value){log(v,"Manual correction",DN[k]+" · "+f+": “"+e.v+"” → “"+i.value+"”","Reviewer");e.v=i.value;e.c=1;e.manual=1}})}
function confirmGate(){readExt(LIVE.v);save();GATE&&GATE()}
function vDetail(id){const v=S.vendors.find(x=>x.id==id);if(!v)return"<h1>Vendor not found</h1>";const f=v.form,cs=v.checks||[],g={};cs.forEach(c=>(g[c.group]=g[c.group]||[]).push(c));
let h=`<div class="row"><h1 class="sp1">${esc(f.legal)}${DB(v)}</h1>${B(v.status)}</div><div class="sub">${v.id} · ${esc(f.type)} · submitted ${dt(v.created)}</div>`;
h+=`<div class="grid g2"><div class="card"><h2>Vendor information</h2><table>${[["Trade name",f.trade],["Address",f.address],["Contact",f.contact+" · "+f.email+" · "+f.phone],["Country",f.country],["PAN",f.pan],["GSTIN",f.gstin],["MSME claimed",f.msme?"Yes – "+f.udyam:"No"],["Bank",f.bank+" · "+f.holder],["Account / IFSC",f.acct+" / "+f.ifsc]].map(r=>`<tr><td class="mu" style="width:120px">${r[0]}</td><td>${esc(r[1]||"–")}</td></tr>`).join("")}</table></div>
<div class="card"><h2>Decision &amp; explanation</h2>${v.decision?`${B(v.decision.status)}<ul>${v.decision.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><p class="mu">${esc(v.decision.rule)}</p><p class="mu">Engine ${v.decision.version||"rules-1"}${v.decision.counts?" · "+["pass","fail","review","unverified","missing"].map(k=>v.decision.counts[k]+" "+k).join(" · "):""}</p>`:'<span class="mu">Not decided yet</span>'}${v.manual?`<p><b>Manual review outcome:</b> ${esc(v.manual)}</p>`:""}<a class="btn s" href="#run-${v.id}">View run</a></div></div>`;
h+=`<div class="card"><h2>Uploaded documents &amp; extracted information</h2>${Object.keys(v.docs).length?editExt(v):'<span class="mu">No documents uploaded</span>'}${(v.docHist||[]).map(d=>`<div class="mu">Superseded ${DN[d.k]}: ${esc(d.file)} (${dt(d.replaced)}) <a href="#" onclick="viewPath('${d.path}');return false">view</a></div>`).join("")}${Object.keys(v.docs).length?'<button class="s" onclick="reverify()">Save corrections &amp; re-verify</button>':""}</div>`;
h+=`<div class="card"><h2>Verification results</h2><div class="note">“Document check” = rule applied to uploaded files. “External” = authorised verification source; in demo mode these are simulated adapters and never real verification.</div>${Object.entries(g).map(([k,l])=>`<h3>${k}</h3><div class="tw"><table>${l.map(c=>`<tr><td style="width:240px">${esc(c.label)}${c.kind=="ext"?' <span class="demo">EXTERNAL</span>':""}</td><td style="width:130px">${B(c.status)}</td><td>${esc(c.msg)}</td></tr>`).join("")}</table></div>`).join("")||'<span class="mu">No results yet</span>'}</div>`;
if(v.email)h+=`<div class="card"><h2>Vendor notification <span class="mu">to ${esc(f.email)}</span> ${B(v.emailState=="sent"?"APPROVED":"PENDING").replace(">APPROVED<",">APPROVED TO SEND / SENT<").replace(">PENDING<",">DRAFT – NOT SENT<")}</h2><textarea id="em" rows="12" ${v.emailState=="sent"?"disabled":""}>${esc(v.email)}</textarea>${v.emailState!="sent"?`<div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="eok" style="width:auto"> I have reviewed this email and authorise sending</label><span class="sp1"></span><button class="ok" onclick="sendEm()">Approve &amp; send</button></div><div class="mu">This prototype has no mail server: approval opens your mail client with the reviewed text and logs the action.</div>`:""}</div>`;
h+=`<div class="grid g2"><div class="card"><h2>Reviewer actions</h2><label>Comment (required)</label><textarea id="cm" rows="2"></textarea><div class="row" style="margin-top:8px"><button class="s" onclick="rev('comment')">Add comment</button>${v.status=="PENDING"?`<button class="ok" onclick="rev('APPROVED')">Approve after manual review</button><button class="d" onclick="rev('REJECTED')">Reject</button>`:""}</div>${(v.comments||[]).map(c=>`<p><b>${dt(c.t)}</b> – ${esc(c.x)}</p>`).join("")}</div>
<div class="card"><h2>Resubmit / corrections</h2><div class="mu">Replace documents or fix fields; relevant checks re-run and earlier runs are preserved.</div>${DK.map(k=>`<label>${DN[k]}</label><input type="file" accept=".pdf,.png,.jpg,.jpeg" data-r="${k}">`).join("")}${[["legal","Legal name"],["pan","PAN"],["gstin","GSTIN"],["acct","Account number"],["ifsc","IFSC"],["udyam","Udyam number"]].map(([k,l])=>`<label>${l}</label><input data-rf="${k}" value="${esc(f[k]||"")}">`).join("")}<div style="margin-top:10px"><button onclick="resub()">Resubmit &amp; re-verify</button></div></div></div>`;
h+=`<div class="card"><h2>Previous submissions &amp; runs</h2>${v.runs.map(r=>`<div>Run #${r.n} · ${dt(r.start)} · ${B(r.decision||"PROCESSING")}</div>`).join("")}</div><div class="card"><h2>Audit trail</h2><div class="tw"><table>${(v.audit||[]).slice().reverse().map(a=>`<tr><td style="width:160px" class="mu">${dt(a.t)}</td><td style="width:90px">${a.who}</td><td style="width:200px"><b>${esc(a.a)}</b></td><td>${esc(a.d)}</td></tr>`).join("")}</table></div></div>`;return h}
const cur=()=>S.vendors.find(x=>x.id==location.hash.slice(3));
function reverify(){const v=cur();readExt(v);save();startRun(v)}
function sendEm(){const v=cur();if(!$("#eok").checked){alert("Please confirm you have reviewed the email.");return}v.email=$("#em").value;v.emailState="sent";log(v,"Notification approved","Reviewed and released by procurement to "+v.form.email,"Reviewer");save();const[s,...b]=v.email.split("\n");location.href="mailto:"+encodeURIComponent(v.form.email)+"?subject="+encodeURIComponent(s.replace("Subject: ",""))+"&body="+encodeURIComponent(b.join("\n").trim());route()}
function rev(a){const v=cur(),x=$("#cm").value.trim();if(!x){alert("A comment is required for every reviewer action.");return}(v.comments=v.comments||[]).push({t:Date.now(),x});log(v,"Reviewer action",(a=="comment"?"Comment: ":"Set "+a+": ")+x,"Reviewer");if(a!="comment"){v.status=a;v.manual=a+" by reviewer – "+x;log(v,"Status change","→ "+a+" (manual)","Reviewer")}save();route()}
function resub(){const v=cur();document.querySelectorAll("[data-rf]").forEach(i=>{if(v.form[i.dataset.rf]!=i.value){log(v,"Resubmission","Field "+i.dataset.rf+" updated","Vendor");v.form[i.dataset.rf]=i.value}});if(v.form.udyam)v.form.msme=true;let n=0;document.querySelectorAll("[data-r]").forEach(i=>{const f=i.files[0];if(f&&/\.(pdf|png|jpe?g)$/i.test(f.name)&&f.size<=5242880){FILES[v.id+i.dataset.r]=f;if(v.docs[i.dataset.r]?.path)(v.docHist=v.docHist||[]).push({k:i.dataset.r,...v.docs[i.dataset.r],replaced:Date.now()});v.docs[i.dataset.r]={file:f.name,size:f.size};n++;log(v,"Resubmission","Replaced "+DN[i.dataset.r]+": "+f.name,"Vendor")}});save();startRun(v)}
function vSet(){const s=S.st;return `<h1>Settings</h1><div class="sub">Rules are data, not code – changes apply to the next verification run.</div><div class="card"><h2>Mandatory documents by vendor type</h2><div class="tw"><table><tr><th>Vendor type</th>${DK.map(k=>`<th>${DN[k]}</th>`).join("")}</tr>${TYPES.map(t=>`<tr><td>${t}</td>${DK.map(k=>`<td><input type="checkbox" style="width:auto" ${s.docs[t][k]?"checked":""} onchange="S.st.docs['${t}'].${k}=this.checked?1:0;save()"></td>`).join("")}</tr>`).join("")}</table></div><label><input type="checkbox" style="width:auto" ${s.udyamIfClaimed?"checked":""} onchange="S.st.udyamIfClaimed=this.checked;save()"> Require Udyam certificate when vendor claims MSME status (non-MSMEs are never penalised)</label></div>
<div class="grid g2"><div class="card"><h2>Name matching</h2><label>Auto-pass similarity (≥) — currently ${Math.round(s.pass*100)}%</label><input type="range" min="50" max="100" value="${s.pass*100}" onchange="S.st.pass=this.value/100;save();route()"><div class="mu">Below this, names go to human review. Names never cause rejection.</div></div>
<div class="card"><h2>Decision rules</h2>${[["rejectInactiveGst","Reject when GST is confirmed inactive/cancelled"],["rejectInvalidUdyam","Reject when a required Udyam registration is confirmed invalid"],["rejectPanMismatch","Reject when document PAN differs from form PAN (otherwise: pending)"],["dupReview","Hold for review on duplicate PAN / GSTIN / bank account"],["humanReview","Require human approval before any notification is sent (always on)"]].map(([k,l])=>`<label><input type="checkbox" style="width:auto" ${s[k]?"checked":""} ${k=="humanReview"?"disabled":""} onchange="S.st.${k}=this.checked;save()"> ${l}</label>`).join("")}</div></div>
<div class="card"><h2>Verification mode</h2><select onchange="S.st.mode=this.value;save();route()"><option value="demo" ${s.mode=="demo"?"selected":""}>Demo – simulated adapters</option><option value="production" ${s.mode=="production"?"selected":""}>Production – authorised services only</option></select><div class="note" style="margin-top:10px">${s.mode=="demo"?"Demo adapters answer from a small synthetic registry; unknown identifiers return UNVERIFIED, never a fabricated success.":"Production mode has no credentials configured, so every external check returns UNVERIFIED and vendors stay PENDING – by design."}</div><label>Verification API key (GST / bank / Udyam provider)</label><input type="password" disabled placeholder="Server-side secret store required"><div class="mu">Credentials must never live in browser code. A real deployment would keep them in a server vault behind role-based access; adapters are isolated behind one interface (<code>adapter(kind,key)</code>) for that swap.</div></div>
<div class="card"><h2>Data</h2><button class="d" onclick="BE.wipe()">Delete all vendor records</button></div>`}
function route(){let h=location.hash.slice(1)||"dash";const m=$("#main");if((h=="settings"&&!BE.can("admin"))||(["new","demo"].includes(h)&&!BE.can("write")))h="dash";$("#nav").innerHTML='<div class="logo"><img src="'+LOGO+'" alt="Logo"><div>Vendor<span>Verify</span></div></div>'+NAV.filter(([k])=>BE.can(k=="settings"?"admin":["new","demo"].includes(k)?"write":"read")).map(([k,l])=>`<a class="${h==k||(h.startsWith("v-")&&k=="vendors")?"on":""}" href="#${k}">${l}</a>`).join("")+BE.badge();
const act=document.activeElement;if(act&&act.closest&&act.closest("#main")&&/INPUT|TEXTAREA/.test(act.tagName)&&act.type!="file"&&h.startsWith("v-")&&!LIVE?.gate)return;
m.innerHTML=h=="dash"?vDash():h=="new"?vNew():h=="vendors"?vList("Vendor Records",S.vendors):h=="history"?vHistory():h=="pending"?vList("Pending Reviews",S.vendors.filter(v=>v.status=="PENDING")):h=="demo"?vDemo():h=="settings"?vSet():h.startsWith("run-")?vRun(h.slice(4)):h.startsWith("v-")?vDetail(h.slice(2)):vDash()}
boot();
</script></body></html>
